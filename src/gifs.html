	<link rel="stylesheet" href="../styles.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous" defer></script>

</head>
<body>
	<main class="site-page">
		<div class="starfield" aria-hidden="true"></div>
		<header class="site-header">
			<a class="wordmark" href="../index.html" aria-label="Jasper home">Jasper<span>.dev</span></a>
			<nav aria-label="Main navigation">
				<a href="../index.html"><span>01</span>// home</a>

				<a href="work.html"><span>03</span>// work</a>

				<a href="contact.html"><span>05</span>// contact</a>
			</nav>
		</header>

		<section class="page-content gifs-page" aria-labelledby="page-title">
			<div class="page-heading">
				<p class="eyebrow">Animation + loops</p>
				<h1 id="page-title">GIFs</h1>
				<p class="page-lede">A collection of moments from media I adore. Made with image grabber and gimp. Select a GIF to take a closer look.</p>
			</div>

			<div class="gif-gallery" aria-label="GIF collection">
				<section class="gif-section" aria-labelledby="gif-section-sololives">
					<h2 class="gif-section-title" id="gif-section-sololives">Solo Lives</h2>
				<button class="gif-entry" type="button" data-title="Towa-sama — 2nd Solo Live" data-description="A looping moment from Towa-sama's 2nd solo live." data-filename="hololive/sololives/towasama_2ndsololive.gif">
					<img src="../gifs/hololive/sololives/towasama_2ndsololive.gif" alt="Towa-sama — 2nd solo live" loading="lazy">
				</button>
				<button class="gif-entry" type="button" data-title="Towa-sama — 2nd Solo Live (Alternate)" data-description="Another looping moment from Towa-sama's 2nd solo live." data-filename="hololive/sololives/towasama_2ndsololive_2.gif">
					<img src="../gifs/hololive/sololives/towasama_2ndsololive_2.gif" alt="Towa-sama — 2nd solo live alternate moment" loading="lazy">
				</button>
				<button class="gif-entry" type="button" data-title="Suisei — Supernova" data-description="A looping moment from Suisei's Supernova performance." data-filename="hololive/sololives/suisei_supernova.gif">
					<img src="../gifs/hololive/sololives/suisei_supernova.gif" alt="Suisei — Supernova" loading="lazy">
				</button>
				</section>
				<section class="gif-section" aria-labelledby="gif-section-mvs">
					<h2 class="gif-section-title" id="gif-section-mvs">Music Videos</h2>
				<button class="gif-entry" type="button" data-title="Suisei — Lollipop MV" data-description="A looping moment from Suisei's Lollipop music video." data-filename="hololive/mvs/suisei_lolipopmv.gif">
					<img src="../gifs/hololive/mvs/suisei_lolipopmv.gif" alt="Suisei — Lollipop music video" loading="lazy">
				</button>
				<button class="gif-entry" type="button" data-title="Miko — Lollipop MV" data-description="A looping moment from Miko's Lollipop music video." data-filename="hololive/mvs/miko_lolipopmv.gif">
					<img src="../gifs/hololive/mvs/miko_lolipopmv.gif" alt="Miko — Lollipop music video" loading="lazy">
				</button>
				<button class="gif-entry" type="button" data-title="MiComet — Lollipop MV" data-description="A looping moment from the MiComet Lollipop music video." data-filename="hololive/mvs/micomet_lolipopmv.gif">
					<img src="../gifs/hololive/mvs/micomet_lolipopmv.gif" alt="MiComet — Lollipop music video" loading="lazy">
				</button>
				</section>
				<section class="gif-section" aria-labelledby="gif-section-fes">
					<h2 class="gif-section-title" id="gif-section-fes">Fes Performances</h2>
				<button class="gif-entry gif-entry-towasama-6thfes" type="button" data-title="Towa-sama — 6th Fes" data-description="A looping moment from Towa-sama's 6th Fes performance." data-filename="hololive/fes/towasama_6thfes.gif">
					<img src="../gifs/hololive/fes/towasama_6thfes.gif" alt="Towa-sama — 6th Fes" loading="lazy">
				</button>
				<button class="gif-entry" type="button" data-title="Suisei & Towa — 3rd Fes" data-description="A looping moment featuring Suisei and Towa at the 3rd Fes." data-filename="hololive/fes/suitowa_3rdfes.gif">
					<img src="../gifs/hololive/fes/suitowa_3rdfes.gif" alt="Suisei and Towa — 3rd Fes" loading="lazy">
				</button>
				<button class="gif-entry" type="button" data-title="Aqutowa — 5th Fes" data-description="A looping moment featuring Aqua and Towa at the 5th Fes." data-filename="hololive/fes/aqutowa_5thfes.gif">
					<img src="../gifs/hololive/fes/aqutowa_5thfes.gif" alt="Aqua and Towa — 5th Fes" loading="lazy">
				</button>
				</section>
				<section class="gif-section" aria-labelledby="gif-section-anime">
					<h2 class="gif-section-title" id="gif-section-anime">Anime</h2>
				<button class="gif-entry" type="button" data-title="Shinji — 3.0+1.0" data-description="A looping moment featuring Shinji from Evangelion: 3.0+1.0." data-filename="anime/shinji_3.0+1.0.gif">
					<img src="../gifs/anime/shinji_3.0+1.0.gif" alt="Shinji — 3.0+1.0" loading="lazy">
				</button>
				<button class="gif-entry" type="button" data-title="Rei — 3.0+1.0" data-description="A looping moment featuring Rei from Evangelion: 3.0+1.0." data-filename="anime/reiq_3.0+1.0.gif">
					<img src="../gifs/anime/reiq_3.0+1.0.gif" alt="Rei — 3.0+1.0" loading="lazy">
				</button>
				<button class="gif-entry gif-entry-asuka" type="button" data-title="Asuka — 3.0+1.0" data-description="A looping moment featuring Asuka from Evangelion: 3.0+1.0." data-filename="anime/asuka_3.0+1.0.gif">
					<img src="../gifs/anime/asuka_3.0+1.0.gif" alt="Asuka — 3.0+1.0" loading="lazy">
				</button>
				<button class="gif-entry gif-entry-asuka-alternate" type="button" data-title="Asuka — 3.0+1.0 (Alternate)" data-description="Another looping moment featuring Asuka from Evangelion: 3.0+1.0." data-filename="anime/asuka_3.0+1.0_2.gif">
					<img src="../gifs/anime/asuka_3.0+1.0_2.gif" alt="Asuka — 3.0+1.0 alternate moment" loading="lazy">
				</button>
				</section>
				<section class="gif-section" aria-labelledby="gif-section-models">
					<h2 class="gif-section-title" id="gif-section-models">3D Models</h2>
					<button class="gif-entry gif-entry-soda-machine" type="button" data-title="Soda Machine" data-description="A looping pixel-art soda machine animation." data-filename="3d models/sodamachine.gif">
						<img src="../gifs/3d%20models/sodamachine.gif" alt="Pixel-art soda machine" loading="lazy">
					</button>
					<button class="gif-entry" type="button" data-title="Triangle Mailbox" data-description="A looping render of a low-poly triangle mailbox model." data-filename="3d models/triangle_mailbox.gif">
						<img src="../gifs/3d%20models/triangle_mailbox.gif" alt="Low-poly triangle mailbox model" loading="lazy">
					</button>
					<button class="gif-entry" type="button" data-title="Car" data-description="A looping render of a 3D car model." data-filename="3d models/car.gif">
						<img src="../gifs/3d%20models/car.gif" alt="3D car model" loading="lazy">
					</button>
				</section>
			</div>
		</section>
	</main>

	<dialog class="gif-dialog" aria-labelledby="gif-dialog-title" aria-describedby="gif-dialog-description">
		<div class="gif-dialog-content">
			<button class="gif-dialog-close" type="button" aria-label="Close GIF details">×</button>
			<p class="eyebrow">GIF details</p>
			<h2 id="gif-dialog-title"></h2>
			<img class="gif-dialog-image" alt="">
			<p id="gif-dialog-description"></p>
			<p class="gif-dialog-filename"></p>
		</div>
	</dialog>
</body>
</html>
